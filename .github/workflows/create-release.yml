name: Create Release

on:
  workflow_dispatch:
    inputs:
      package_bump:
        description: "Version bump (patch, minor, major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false # critical! disables default token

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump package version
        id: bump
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.package_bump }} --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push release branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="release/release-${{ steps.bump.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add package.json 
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"

          # Authenticate with PAT and push
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git push origin "$BRANCH"
