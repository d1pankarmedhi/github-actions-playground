name: Create Release

on:
  workflow_dispatch:
    inputs:
      package_bump:
        description: "Package version bump (e.g., patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Git
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Bump package version
        id: version_bump
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.package_bump }} --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add package.json 
          git commit -m "chore(release): bump version to ${{ steps.version_bump.outputs.new_version }} [skip ci]"

      - name: Set remote using PAT
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}

      - name: Create and push release branch
        run: |
          BRANCH_NAME=release/release-${{ steps.version_bump.outputs.new_version }}
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
